# Web con raíz en backend: el package.json de esa carpeta delega en el frontend Vite.
# El build debe inicializar el submódulo del backend (Render no lo hace solo).
services:
  - type: web
    name: despliegue-sportster
    runtime: node
    rootDir: pi-25-26-backend-el-batallon
    buildCommand: git -C .. submodule update --init --recursive && yarn
    startCommand: yarn start
