# Blueprint Render — Sportster (API Spring Boot en Docker + React + Postgres).
#
# IMPORTANTE: son DOS URLs distintas. Si abres en el navegador la URL del servicio Docker (API),
# solo verás JSON en / — es normal. La interfaz React es el SEGUNDO servicio web (Node, sportster-web).
#
# Si creaste solo el API a mano (ej. despliegue-sportster-3.onrender.com), el front NO se despliega solo:
#   Render → New + → Web Service → Runtime Node, rootDir pi-25-26-frontend-el-batallon,
#   build: yarn install --frozen-lockfile && yarn build, start: yarn start,
#   variable VITE_API_ORIGIN = https://TU-API.onrender.com (sin /api/v1).
#   En el API, APP_CORS_ALLOWED_ORIGINS debe incluir la URL https://TU-FRONT.onrender.com
#
# Uso blueprint:
# 1) Dashboard Render → New → Blueprint → conecta este repo.
# 2) Si YA tienes Postgres, borra `databases` y en sportster-api configura SPRING_DATASOURCE_* a mano.
# 3) Si cambias los `name` de los servicios, en el dashboard:
#    - VITE_API_ORIGIN del front = https://<tu-api>.onrender.com (sin /api/v1)
#    - APP_CORS_ALLOWED_ORIGINS del API = https://<tu-front>.onrender.com,http://localhost:5173,...
#
# Nombres por defecto del blueprint: sportster-api + sportster-web (+ sportster-postgres).

databases:
  - name: sportster-postgres
    databaseName: sportster
    user: sportster_user
    region: oregon
    plan: free

services:
  # --- API (Dockerfile en la raíz del repo) ---
  - type: web
    name: sportster-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: sportster-postgres
          property: connectionString
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://sportster-web.onrender.com,http://localhost:5173,http://127.0.0.1:5173"

  # --- Frontend (Vite build + serve) ---
  - type: web
    name: sportster-web
    runtime: node
    region: oregon
    plan: free
    rootDir: pi-25-26-frontend-el-batallon
    buildCommand: yarn install --frozen-lockfile && yarn build
    startCommand: yarn start
    envVars:
      - key: VITE_API_ORIGIN
        value: https://sportster-api.onrender.com
