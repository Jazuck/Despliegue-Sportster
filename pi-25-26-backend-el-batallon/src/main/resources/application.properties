# CORS: orígenes del frontend (coma). Sobreescribe en Render con APP_CORS_ALLOWED_ORIGINS si cambian las URLs.
# Por defecto incluye el front en Render + Vite local.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://despliegue-sportster-1.onrender.com,https://despliegue-sportster-2.onrender.com}

# PostgreSQL — variables en Render: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#
# OBLIGATORIO el doble slash tras postgresql:  jdbc:postgresql://HOST:PUERTO/BD?params
# Mal (rompe sslmode): jdbc:postgresql:dpg-xxx...  ← falta //
# Bien: jdbc:postgresql://dpg-abc123-a.REGION.aws.neon.tech:5432/sportster?sslmode=require
# Si Render te da "postgresql://..." sin "jdbc:", añade el prefijo jdbc: y duplica las barras: jdbc:postgresql://...
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sportster}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Render inyecta PORT; en local sigue siendo 8080.
server.port=${PORT:8080}

# JSON con data URL larga (imagen del deporte) puede superar el límite por defecto de Tomcat (~2 MB).
server.tomcat.max-http-post-size=15MB
