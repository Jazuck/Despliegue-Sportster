# Perfil activo en Render (render.yaml → SPRING_PROFILES_ACTIVE=render).
spring.config.activate.on-profile=render
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Evita depender de DatabaseMetaData en el primer arranque (conexión lenta / SSL).
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.orm.database.major_version=18

